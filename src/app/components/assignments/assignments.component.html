<section id="artifacts" class="assignments-section">
  <div class="container-lg">
    <h2 class="section-title" data-aos="fade-up">Academic Artifacts</h2>
    <div class="row">
      <div
        class="col-lg-4 col-md-6 mb-4"
        *ngFor="let a of assignments; let i = index"
        
      >
        <div class="card h-100 assignment-card" (click)="openModal(a)" role="button" tabindex="0">
          <div class="card-header">
            <span class="badge bg-primary">{{ a.grade }}</span>
            <span>{{ a.date }}</span>
          </div>
          <div class="card-body">
            <h5 class="card-title">{{ a.title }}</h5>
            <p>{{ a.description }}</p>
            <div>
              <span class="tech" *ngFor="let t of a.tech">{{ t }}</span>
            </div>
          </div>
          <div class="card-footer">
            <small class="text-muted">Click to view details →</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Modal Popup -->
<div class="modal-overlay" [class.active]="selectedAssignment" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()" *ngIf="selectedAssignment">
    <div class="modal-header">
      <h2>{{ selectedAssignment.title }}</h2>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <!-- Assignment Details Section -->
      <div class="assignment-details" *ngIf="selectedAssignment.details">
        <div class="detail-row" *ngFor="let detail of selectedAssignment.details">
          <h3 class="detail-heading">{{ detail.title }}</h3>
          <!-- <p class="detail-description">{{ detail.description }}</p> -->

          <p class="detail-description" [innerHTML]="detail.description"></p>

          <div class="detail-references" [innerHTML]="detail.references"></div> <!-- Render the HTML content safely -->
        </div>
      </div>
      
      <!-- Render the HTML content safely -->
      <div [innerHTML]="selectedAssignment.reference"></div>
    </div>

  </div>
</div>
